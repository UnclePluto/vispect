[project]
name = "vispect-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17", "psycopg[binary]>=3.2,<4", "dj-database-url>=2,<4", "jsonschema>=4,<5", "openpyxl>=3.1,<4", "gunicorn>=23,<24"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

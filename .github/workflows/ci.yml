name: 平台验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vispect
          POSTGRES_PASSWORD: ci-postgres-2026
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vispect"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-secret-for-platform-tests
      DJANGO_DEBUG: 'true'
      VISPECT_OWNER_PASSWORD: ci-owner-2026
      VISPECT_APP_PASSWORD: ci-app-2026
      VISPECT_CONTROL_PASSWORD: ci-control-2026
      DATABASE_URL: postgresql://vispect_app:ci-app-2026@127.0.0.1:5432/vispect
      CONTROL_DATABASE_URL: postgresql://vispect_control:ci-control-2026@127.0.0.1:5432/vispect
      MIGRATION_DATABASE_URL: postgresql://vispect_owner:ci-owner-2026@127.0.0.1:5432/vispect
      PGPASSWORD: ci-postgres-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install uv==0.12.0
      - run: npm install --global pnpm@10.33.0
      - run: psql -h 127.0.0.1 -U postgres -d vispect -v ON_ERROR_STOP=1 -f infra/postgres/init-roles.sql
      - run: uv sync --project backend --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 浏览器失败记录
          path: frontend/test-results/
